admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 3000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                upgrade_configs:
                  - upgrade_type: websocket
                route_config:
                  name: local
                  virtual_hosts:
                    - name: app
                      domains: ["*"]
                      routes:
                        # WebSocket connections are long-lived by design, so they get no request
                        # timeout. Matching on the upgrade header rather than a path, because the
                        # socket connects to "/" like everything else.
                        - match:
                            prefix: "/"
                            headers:
                              - name: upgrade
                                string_match: { exact: websocket, ignore_case: true }
                          route:
                            cluster: api
                            timeout: 0s
                        # Ordinary HTTP does get one. Previously a single `timeout: 0s` on the
                        # catch-all route disabled request timeouts for plain HTTP as well, so a
                        # stuck request could be held open indefinitely.
                        - match: { prefix: "/" }
                          route:
                            cluster: api
                            timeout: 30s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: api
      connect_timeout: 2s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      # Without active checks, a booting or already-dead instance stays in the rotation and
      # takes its share of traffic. /healthz reports 503 while draining, so a shutting-down
      # instance is pulled out before it stops listening.
      health_checks:
        - timeout: 2s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check:
            path: /healthz
      load_assignment:
        cluster_name: api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: api, port_value: 3000 }
