<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relay</title>
  <style>
    body { font: 15px/1.4 system-ui, sans-serif; margin: 0; display: flex; height: 100vh; }
    #sidebar { width: 280px; border-right: 1px solid #ddd; overflow-y: auto; }
    #sidebar header { display: flex; align-items: center; justify-content: space-between; padding: 12px; }
    #sidebar h2 { font-size: 13px; text-transform: uppercase; color: #888; margin: 0; }
    #newConv { font-size: 13px; cursor: pointer; }
    #wsStatus { font-size: 10px; vertical-align: middle; }
    #conversations { list-style: none; margin: 0; padding: 0; }
    #conversations li { padding: 12px; cursor: pointer; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
    #conversations li:hover { background: #f6f6f6; }
    #conversations li.active { background: #eef4ff; }
    .dot { color: #e5484d; font-size: 12px; }
    #main { flex: 1; display: flex; flex-direction: column; }
    #title { padding: 12px; margin: 0; border-bottom: 1px solid #ddd; }
    #messages { flex: 1; overflow-y: auto; padding: 12px; }
    .msg { padding: 6px 0; }
    .msg.focus { background: #fff8c4; border-radius: 3px; padding: 6px 4px; }
    #typing { padding: 2px 12px; height: 18px; font-size: 12px; color: #888; font-style: italic; }
    #notice { padding: 8px 12px; background: #fff4e5; border-top: 1px solid #f0d0a0; font-size: 13px; }
    #composer { display: flex; border-top: 1px solid #ddd; padding: 8px; gap: 8px; }
    #text { flex: 1; padding: 8px; }
    #loadOlder { display: block; margin: 0 auto 12px; padding: 4px 10px; cursor: pointer; }
    #searchForm { padding: 0 12px 12px; }
    #search { width: 100%; box-sizing: border-box; padding: 6px 8px; }
  </style>
</head>
<body>
  <div id="sidebar">
    <header>
      <h2>Conversations <span id="wsStatus" title="connecting…">○</span></h2>
      <button id="newConv">+ New</button>
    </header>
    <form id="searchForm"><input id="search" autocomplete="off" placeholder="Search messages…" /></form>
    <ul id="conversations"></ul>
  </div>
  <div id="main">
    <h3 id="title">Pick a conversation</h3>
    <div id="messages"></div>
    <div id="typing"></div>
    <div id="notice" hidden></div>
    <form id="composer">
      <input id="text" autocomplete="off" placeholder="Message…" />
      <button>Send</button>
    </form>
  </div>
  <script src="/app.js"></script>
</body>
</html>
